<style>
body{margin:0;background:#000}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
html{color-scheme:dark;scrollbar-width:thin;scrollbar-color:rgba(242,241,238,.18) #000}
::-webkit-scrollbar{width:8px;height:8px;background:#000}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:rgba(242,241,238,.16);border-radius:8px;border:2px solid #000}
::-webkit-scrollbar-thumb:hover{background:rgba(242,241,238,.32)}
.fn{--accent:#FFD47A;--paper:#F2F1EE;--fog:#B4B3AF;--mute:#8C8B87;--gut:clamp(20px,6.5vw,112px);--out:cubic-bezier(.19,1,.22,1)}
.fn *{box-sizing:border-box}
.fn button,.fn input{font:inherit;color:inherit}
.fn button{background:none;border:0;cursor:pointer;padding:0;text-align:left}
.fn :focus-visible{outline:1px solid var(--paper);outline-offset:4px}
.fn .nav a,.fn .bar-end a,.fn .tlink{position:relative}
.fn .nav a::after,.fn .bar-end a::after,.fn .tlink::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .35s var(--out)}
.fn .nav a[aria-current="page"]{color:var(--accent)}
.fn .nav a[aria-current="page"]::after{transform:scaleX(1)}
@media (hover:hover){.fn .nav a:hover::after,.fn .bar-end a:hover::after,.fn .tlink:hover::after{transform:scaleX(1);transform-origin:left}}
.fn .btn{transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .16s ease-out}
.fn .btn:active{transform:scale(.97)}
@media (hover:hover){.fn .btn.solid:hover{background:transparent !important;color:var(--paper) !important;border-color:var(--paper) !important}.fn .btn.line:hover{background:var(--paper);color:#000}}
.fn .sim{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.fn .pick{transition:border-color .2s ease,opacity .2s ease}
.fn .pick.is-on{border-color:var(--accent) !important}
.fn .pick.is-on .pick-name{color:var(--accent)}
@media (hover:hover){.fn .pick:not(.is-on):hover{border-color:rgba(242,241,238,.5) !important}}
.fn .picks{scrollbar-width:none}.fn .picks::-webkit-scrollbar{display:none}
.fn .chip{transition:background-color .2s ease,color .2s ease,border-color .2s ease}
.fn .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent) !important;color:#000}
.fn input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}
.fn input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--accent) 0 var(--p,50%),rgba(242,241,238,.2) var(--p,50%) 100%)}
.fn input[type=range]::-moz-range-track{height:2px;background:rgba(242,241,238,.2)}
.fn input[type=range]::-moz-range-progress{height:2px;background:var(--accent)}
.fn input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-8px;border-radius:50%;background:var(--paper);border:0;box-shadow:0 0 0 4px rgba(255,212,122,.25)}
.fn input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--paper);border:0;box-shadow:0 0 0 4px rgba(255,212,122,.25)}
.fn .result{position:sticky;top:24px}
.fn .profiles{grid-template-columns:repeat(3,minmax(0,1fr))}
.fn .steps{grid-template-columns:repeat(4,minmax(0,1fr))}
.fn details summary{list-style:none;cursor:pointer}
.fn details summary::-webkit-details-marker{display:none}
.fn details .pm{transition:transform .3s var(--out)}
.fn details[open] .pm{transform:rotate(45deg)}
.fn .menu-btn{display:none}
.fn .msheet{position:fixed;inset:0;z-index:60;background:#0d0d0d;display:none;flex-direction:column;padding:14px 20px 28px}
.fn .msheet.is-open{display:flex}
.fn .msheet nav a[aria-current="page"]{color:var(--accent)}
@media (max-width:1024px){
 .fn .sim{grid-template-columns:1fr !important}
 .fn .result{position:relative;top:0}
 .fn .profiles{grid-template-columns:1fr}
 .fn .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
 .fn{--gut:20px}
 .fn .bar{grid-template-columns:1fr auto !important;height:56px !important}
 .fn .nav,.fn .bar-end{display:none !important}
 .fn .menu-btn{display:flex}
 .fn .intro{padding:36px var(--gut) 28px !important}
 .fn .intro h1{font-size:30px !important}
 .fn section.blk{padding:52px var(--gut) !important}
 .fn section.blk h2{font-size:24px !important;margin-bottom:26px !important}
 .fn .panel{padding:22px 18px !important}
 .fn .big{font-size:40px !important}
 .fn .steps{grid-template-columns:1fr;gap:0 !important}
 .fn .steps li{padding:14px 0 !important}
 .fn .cta{flex-direction:column;align-items:flex-start !important}
}
@media (prefers-reduced-motion:reduce){.fn details .pm{transition:none}}

/* navegación v11 */
.fn .bar{position:sticky;top:0;z-index:20}
.fn .crumbs a{color:#B4B3AF}
@media (hover:hover){.fn .crumbs a:hover{color:#F2F1EE}}
.fn .next{transition:border-color .3s ease}
.fn .next .arr{transition:transform .35s var(--out)}
@media (hover:hover){.fn .next:hover{border-color:rgba(242,241,238,.4) !important}.fn .next:hover .arr{transform:translateX(6px)}}
.fn .pie-grid{grid-template-columns:1.3fr 1fr 1.2fr 1fr}
.fn .pie a{color:#B4B3AF;transition:color .2s ease}
@media (hover:hover){.fn .pie a:hover{color:#F2F1EE}}
.fn .wa-float{transition:transform .16s ease-out}
.fn .wa-float:active{transform:scale(.96)}
@media (max-width:900px){.fn .pie-grid{grid-template-columns:1fr 1fr !important}}
@media (max-width:720px){
 .fn .crumbs{padding-top:12px !important}
 .fn .next{margin:0 var(--gut) 56px !important;padding:24px 20px !important}
 .fn .next .nt{font-size:24px !important}
 .fn .wa-float span{display:none}
 .fn .wa-float{width:52px;padding:0 !important;justify-content:center}
}
@media (max-width:520px){.fn .pie-grid{grid-template-columns:1fr !important}}
</style>
