body{margin:0;background:#000}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.cg{--car:#94DAFB;--paint:#C1906F;--ent:#A9E5BB;--fin:#FFD47A;--noir:#000;--bar:#151515;--paper:#F2F1EE;--fog:#B4B3AF;--line:rgba(242,241,238,.22);--gut:clamp(20px,6.5vw,112px);--bar-h:64px;--rail-h:76px;--out:cubic-bezier(.19,1,.22,1);--soft:cubic-bezier(.4,0,.2,1)}
.cg *{box-sizing:border-box}
.cg button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.cg :focus-visible{outline:1px solid var(--paper);outline-offset:4px}
.cg .bar{opacity:0;transition:opacity .9s var(--soft) .15s}
.cg.is-ready .bar{opacity:1}
.cg .nav a,.cg .bar-end a{position:relative}
.cg .nav a::after,.cg .bar-end a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .35s var(--out)}
@media (hover:hover){.cg .nav a:hover::after,.cg .bar-end a:hover::after{transform:scaleX(1);transform-origin:left}}
.cg .slide{opacity:0;transition:opacity 1.1s var(--soft);pointer-events:none}
.cg .slide.is-active{opacity:1;pointer-events:auto}
.cg .media{transform:scale(1.07);transition:transform 1.4s var(--soft)}
.cg.is-ready .slide.is-active .media{transform:scale(1);transition:transform 9s cubic-bezier(.25,.1,.25,1)}
.cg .media img,.cg .media video{width:100%;height:100%;object-fit:cover;display:block}
.cg .s1 img{object-position:50% 62%}
.cg .s2 img{object-position:50% 58%}
/* foto detrás del texto, enmarcada con margen y fundida a negro en sus cuatro bordes */
.cg .s1 .media,.cg .s2 .media{inset:clamp(16px,3vh,32px) clamp(16px,3vw,56px) 0 !important;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 10%,#000 90%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 9%,#000 70%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 10%,#000 90%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 9%,#000 70%,transparent 100%);mask-composite:intersect}
.cg .s3 .ambient{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(34px) brightness(.38) saturate(.9)}
.cg .s3 .film{position:absolute;right:calc(var(--gut) + 4vw);top:50%;height:min(78%,640px);aspect-ratio:9/16;transform:translateY(-54%);overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.6)}
.cg .shade{background:linear-gradient(to top,rgba(0,0,0,.88) 0,rgba(0,0,0,.42) 34%,rgba(0,0,0,0) 60%),linear-gradient(90deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 58%)}
.cg .slide:not(.is-active) .copy{opacity:0;transition:opacity .25s var(--soft)}
.cg .ln{display:block;overflow:hidden;padding-bottom:.08em}
.cg .ln>span{display:block;transform:translateY(108%);transition:transform .28s var(--soft)}
.cg.is-ready .slide.is-active .ln>span{transform:none;transition:transform 1s var(--out);transition-delay:calc(.45s + var(--i,0)*.075s)}
.cg .title{font-size:clamp(28px,2.7vw,44px)}
.cg .btn{transition:background-color .2s ease,color .2s ease,transform .16s ease-out}
@media (hover:hover){.cg .btn.solid:hover{background:transparent;color:var(--paper)}.cg .btn.line:hover{background:var(--paper);color:#000}.cg .tab:hover{color:var(--paper)}}
.cg .btn:active{transform:scale(.97)}
.cg .rail{opacity:0;transform:translateY(10px);transition:opacity .9s var(--soft) 1.1s,transform .9s var(--out) 1.1s}
.cg.is-ready .rail{opacity:1;transform:none}
.cg .tab{color:var(--fog);transition:color .3s ease}
.cg .tab::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--line)}
.cg .tab .fill{transform:scaleX(0);transform-origin:left}
.cg .tab.is-active{color:var(--paper)}
.cg .tab.is-active strong{color:var(--tab-accent)}
.cg .s1 .meta,.cg .s2 .meta{color:var(--car)}
.cg .s3 .meta{color:var(--paint)}
.cg .s4 .meta{color:var(--ent)}
.cg .s4 .ambient{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(34px) brightness(.34) saturate(.8)}

.cg .tab .short{display:none}
.cg.is-ready .tab.is-active .fill{animation-name:cgfill;animation-timing-function:linear;animation-fill-mode:forwards}
.cg.is-paused .tab.is-active .fill{animation-play-state:paused}
@keyframes cgfill{to{transform:scaleX(1)}}
.cg .intro{transition:opacity 1.4s var(--soft)}
.cg.is-ready .intro{opacity:0}
.cg .menu-btn,.cg .sheet{display:none}
@media (max-width:820px){
 .cg{--bar-h:56px;--rail-h:64px;--gut:20px}

 .cg .s1 .media,.cg .s2 .media{inset:0 0 auto 0 !important;width:100%;height:60%;-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 52%,transparent 100%);-webkit-mask-composite:source-over;mask-image:linear-gradient(to bottom,#000 0,#000 52%,transparent 100%);mask-composite:add}
 .cg .s1 .shade,.cg .s2 .shade{background:none}
 .cg .s3 .film,.cg .s4 .film{inset:0;height:100%;width:100%;transform:none;box-shadow:none;border:0}
 .cg .s3 .ambient,.cg .s4 .ambient{display:none}
 .cg .s4 .film img{object-position:50% 30%}
 .cg .shade{background:linear-gradient(to top,rgba(0,0,0,.92) 0,rgba(0,0,0,.55) 42%,rgba(0,0,0,0) 72%)}
 .cg .copy{bottom:calc(var(--rail-h) + 22px) !important}
 .cg .meta{font-size:11px !important;margin-bottom:10px !important}
 .cg .title{font-size:27px;margin-bottom:12px !important}
 .cg .lead{font-size:14.5px !important;margin-bottom:20px !important}
 .cg .ctas>span{gap:10px !important}
 .cg .btn{height:46px !important;padding:0 10px !important;flex:1;font-size:11.5px !important;letter-spacing:.08em !important;white-space:nowrap}
 .cg .btn.solid{flex:1.3}
 .cg .rail{gap:10px !important;grid-template-columns:repeat(4,minmax(0,1fr)) 36px !important}
 .cg .tab .long{display:none}

 .cg .tab small{display:none}
 .cg .pause{width:36px !important;margin-top:2px !important}
}
@media (prefers-reduced-motion:reduce){
 .cg .media,.cg.is-ready .slide.is-active .media{transform:none;transition:none}

 .cg .slide{transition-duration:.3s}
 .cg.is-ready .tab.is-active .fill{animation:none;transform:scaleX(1)}
